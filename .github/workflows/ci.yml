name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: CI only needs to read the repo (no token write access).
permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check texthumanize/ tests/

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest --tb=short --timeout=120 -q

      - name: Run tests fast parallel (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: pytest -n auto --timeout=120 --tb=short -q

      - name: Type check with mypy (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          mypy texthumanize/ --ignore-missing-imports --no-error-summary

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        # Parallel to offset instrumentation slowdown. Perf/timing tests are
        # deselected (`-m "not perf"`): wall-clock budgets are unreliable under
        # coverage and add no coverage value — they still run full-speed in the
        # Python matrix jobs. TEXTHUMANIZE_TIMEOUT lifts the pipeline's internal
        # deadline so instrumentation slowdown doesn't abort real work.
        env:
          TEXTHUMANIZE_TIMEOUT: "600"
        run: |
          pytest -n auto --timeout=600 -q -m "not perf" \
            --cov=texthumanize --cov-report=xml --cov-report=term-missing:skip-covered \
            --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static security analysis (bandit)
        run: bandit -c pyproject.toml -r texthumanize -ll

      - name: Dependency vulnerability audit (pip-audit)
        # Non-blocking on advisories in transitive deps we can't immediately
        # patch, but surfaces them in the log. Drop `|| true` to make it a gate.
        run: pip-audit --strict --desc || true

  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json

      - name: Install Composer dependencies
        working-directory: php
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        working-directory: php
        run: vendor/bin/phpunit --colors=always

  js:
    name: TypeScript / JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: js
        run: npm install

      - name: Run tests
        working-directory: js
        run: npm test

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Build documentation
        run: mkdocs build --strict
