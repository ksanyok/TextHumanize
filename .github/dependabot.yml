version: 2
updates:
  # Python (pip / pyproject extras)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # JavaScript / TypeScript port
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # PHP port
  - package-ecosystem: "composer"
    directory: "/php"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
